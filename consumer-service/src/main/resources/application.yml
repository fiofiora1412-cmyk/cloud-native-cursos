spring:
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        ddl-auto: update
        format_sql: true

  application:
    name: consumer-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8082}

app:
  consumer:
    simulate-error-for-product: ${CONSUMER_SIMULATE_ERROR_FOR_PRODUCT:false}
  rabbitmq:
    exchange: cursos.exchange
    queue: cursos.queue
    routing-key: curso.creado
    dlx-exchange: cursos.dlx.exchange
    dlq: cursos.dlq
    dlq-routing-key: cursos.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


aws:
  region: us-east-1

  s3:
    bucket: ${AWS_S3_BUCKET}

  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    session-token: ${AWS_SESSION_TOKEN}

logging:
  level:
    org.springframework.security: TRACE
