spring:
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  application:
    name: producer-service

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        default-requeue-rejected: false


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://bastiancloudnative1.b2clogin.com/d84f797a-7438-4aba-a2e4-6d9a89a1d058/v2.0/
          jwk-set-uri: https://bastiancloudnative1.b2clogin.com/bastiancloudnative1.onmicrosoft.com/discovery/v2.0/keys?p=b2c_1_signin_signup

server:
  port: ${SERVER_PORT:8081}

app:
  security:
    audience: a8398803-70d3-4643-b77e-b05e57557aef
  rabbitmq:
    exchange: cursos.exchange
    queue: cursos.queue
    routing-key: curso.creado
    dlx-exchange: cursos.dlx.exchange
    dlq: cursos.dlq
    dlq-routing-key: cursos.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
